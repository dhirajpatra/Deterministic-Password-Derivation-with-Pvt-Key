# cargo-deny policy: licenses, banned crates, allowed sources. Run: cargo deny check
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "CC0-1.0", "Zlib"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The core must never gain network dependencies. `tokio` (runtime only; no net feature) is allowed solely as a
# dependency of flutter_rust_bridge in the FFI crate, never in pwdx-core.
deny = [
  { name = "reqwest" }, { name = "hyper" }, { name = "openssl" }, { name = "openssl-sys" },
  { name = "native-tls" }, { name = "rustls" }, { name = "ureq" }, { name = "curl" },
  { name = "tokio", wrappers = ["flutter_rust_bridge"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
