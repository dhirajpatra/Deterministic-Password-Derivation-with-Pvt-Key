[package]
name = "rust_lib_pwdx_app"
version = "0.1.0"
edition = "2021"
description = "flutter_rust_bridge glue for pwdx-core (thin: no logic of its own)"
license = "PolyForm-Noncommercial-1.0.0"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
pwdx-core = { path = "../../crates/core" }
zeroize = "1"

[dev-dependencies]
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
