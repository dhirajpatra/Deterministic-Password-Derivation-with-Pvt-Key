name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The gate for idempotence: identical output for every vector on every OS.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --workspace --locked
      - name: CLI self-test
        run: cargo run --release --locked -p pwdx -- selftest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with: { command: "check" }
      - uses: rustsec/audit-check@v2
        with: { token: "${{ secrets.GITHUB_TOKEN }}" }

  # The independent Python reference must still reproduce the committed vectors byte for byte.
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install argon2-cffi
      - run: python testvectors/reference.py
      - name: vectors unchanged
        run: git diff --exit-code testvectors/v1.json

  # Static, single-file Linux binary (the "install by copying one file" artifact).
  static-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-unknown-linux-musl }
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p pwdx --target x86_64-unknown-linux-musl
      - run: |
          file target/x86_64-unknown-linux-musl/release/pwdx | tee /dev/stderr | grep -qi "statically linked"
          target/x86_64-unknown-linux-musl/release/pwdx selftest
      - uses: actions/upload-artifact@v4
        with: { name: pwdx-linux-x86_64-static, path: target/x86_64-unknown-linux-musl/release/pwdx }

  # Short fuzz smoke run (nightly + cargo-fuzz). Longer campaigns: run locally or on a schedule.
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: |
          cd fuzz
          cargo fuzz run site_normalize -- -max_total_time=60
          cargo fuzz run openssh_import -- -max_total_time=60
          cargo fuzz run backup_import  -- -max_total_time=60 -timeout=30

  # ---- Flutter app jobs -------------------------------------------------------------------------------------
  # UNVERIFIED: written without access to a Flutter SDK, so these jobs are allowed to fail (continue-on-error)
  # until they have been seen green once. Then remove `continue-on-error` and make them required.
  app-vectors-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 app/tool/gen_vectors_dart.py
      - name: Dart vector data matches testvectors/v1.json
        run: git diff --exit-code app/integration_test/vectors_data.dart

  app-desktop:
    name: app vectors via FFI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Linux desktop deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb ninja-build libgtk-3-dev libsecret-1-dev
      - run: bash scripts/bootstrap_app.sh
      - name: Vectors through the real Rust library (Linux)
        if: runner.os == 'Linux'
        run: cd app && xvfb-run flutter test integration_test/vectors_test.dart -d linux
      - name: Vectors through the real Rust library (Windows)
        if: runner.os == 'Windows'
        run: cd app && flutter test integration_test/vectors_test.dart -d windows
      - name: Vectors through the real Rust library (macOS)
        if: runner.os == 'macOS'
        run: cd app && flutter test integration_test/vectors_test.dart -d macos

  app-android:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: bash scripts/bootstrap_app.sh
      - name: Release APK must not request INTERNET
        run: |
          cd app && flutter build apk --release
          bash ../scripts/check_android_no_network.sh build/app/outputs/flutter-apk/app-release.apk
      - name: Vectors on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: cd app && flutter test integration_test/vectors_test.dart

  app-ios:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-ios-sim,aarch64-apple-ios" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: bash scripts/bootstrap_app.sh
      - uses: futureware-tech/simulator-action@v3
        with: { model: "iPhone 15" }
      - run: cd app && flutter test integration_test/vectors_test.dart
